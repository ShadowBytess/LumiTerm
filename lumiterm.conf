# lumiterm config — custom syntax, not TOML.
# Place this file at ~/.config/lumiterm/lumiterm.conf

window {
    width: 1000
    height: 650
    opacity: 1.0
    padding: 8
}

font {
    # Point this at any TTF/OTF monospace font installed on your system.
    # Find installed fonts with: fc-list | grep -i mono
    path: "/usr/share/fonts/TTF/JetBrainsMonoNerdFont-Regular.ttf"
    size: 14
}

shell {
    program: "/bin/bash"
}

colors {
    background: #1e1e2e
    foreground: #cdd6f4
    cursor: #f5e0dc

    black: #45475a
    red: #f38ba8
    green: #a6e3a1
    yellow: #f9e2af
    blue: #89b4fa
    magenta: #f5c2e7
    cyan: #94e2d5
    white: #bac2de

    bright_black: #585b70
    bright_red: #f38ba8
    bright_green: #a6e3a1
    bright_yellow: #f9e2af
    bright_blue: #89b4fa
    bright_magenta: #f5c2e7
    bright_cyan: #94e2d5
    bright_white: #a6adc8
}
